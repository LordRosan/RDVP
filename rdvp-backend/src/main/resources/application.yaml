spring:
  application:
    name: rdvp-backend
  datasource:
    url: ${RDVP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rdvp}
    username: ${RDVP_DATASOURCE_USERNAME:rdvp}
    password: ${RDVP_DATASOURCE_PASSWORD:rdvp_dev_password}
    hikari:
      maximum-pool-size: ${RDVP_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${RDVP_DATASOURCE_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${RDVP_SERVICE_VERSION:0.1.0}

rdvp:
  service:
    name: ${RDVP_SERVICE_NAME:rdvp-backend}
    version: ${RDVP_SERVICE_VERSION:0.1.0}
